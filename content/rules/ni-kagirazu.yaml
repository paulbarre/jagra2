id: ni-kagirazu
title: 〜に限らず
meaning:
  en: not only… but also
notes:
  en: Equivalent to 〜だけでなく、ほかにも, but more formal.
structure:
  - "**noun**に限らず"
examples:
  - ja: 環境対策のためにも、__夏__**に限らず**、年間を通して節電を心がけるべきだ。
  - ja: 水の問題は__特定の地域__**に限らず**、世界的な問題になるだろう。
  - ja: __車__**に限らず**、自転車でもぶつかったら大けがをしますから注意してください。
  - ja: __電化製品__**に限らず**、あらゆる分野で新製品の開発競争が行われています。
  - ja: 見合い結婚は__日本__**に限らず**ほかの国でも行われている。
    en: Arranged marriage is not limited to Japan; it is practiced in other countries, too.
  - ja: 音楽は__クラシック__**に限らず**何でも聞きます。
    en: Talking about music, I listen to any music, not just classical music.
  - ja: このバーは__男性だけ__**に限らず**女性の間にも人気がある。
    en: This bar is popular not only among men but also among women.
  - ja: 果物は__何__**に限らず**好きです。
    en: My preference for fruit is unlimited (lit. not limited to something); I like any kind.
  - ja: __何事__**に限らず**仕事は誠意をもって行うことが大切だ。
    en: Whatever you do (lit. Not limited to anything), it is important to do it with sincerity.