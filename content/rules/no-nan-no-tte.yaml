id: no-nan-no-tte
title: 〜のなんのって
meaning:
  en: so ~ that / extremely ~
notes:
  en: A casual expression to express the feeling that something is so extreme that the speaker feels it cannot be explained in words.
structure:
  - "**Pl**のなんのって"
  - "**なA**なのなんのって"
  - "**!**のなんのって cannot be preceded by a noun"
examples:
  - ja: |
      A：どうしたの？顔、腫れてるよ。
      B：虫歯を抜いたら、痛いのなんのって。何も食べられないんだ。
  - ja: |
      A：あくびばっかりして、寝不足？
      B：隣の部屋の人がテレビでサッカー見ていて、うるさいのなんのって、全然寝られなかったんだ。
  - ja: |
      A：突然部長に呼ばれてさ、部長のお嬢さんと見合いしないかって。びっくりしたのなんのって。
      B：で、見合いするの？
  - ja: 午前中、忙しかったのなんのって、トイレに行くひまもないくらいだった。
  - ja: |
      A：昨日のハイキング、思いのほか大変だったね。
      B：ほんと、ぶっ続けで5時間歩きっぱなし。疲れたのなんのって、最後はもう一歩も歩けないっていう感じだったよね。
