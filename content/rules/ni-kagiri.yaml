id: ni-kagiri
title: 〜に限り
meaning:
  en: restricted to
notes:
  en: |
    Limits something to a specific person, thing, time, or condition. Commonly used in formal notices and announcements.
structure:
  - "**noun**に限り"
  - "**noun**に限る。"
examples:
  - ja: 本日**に限り**、通常価格100グラム1,500円の牛肉を半額でご提供いたしております。
  - ja: このコーナーのバッグ**に限り**、全品3,000円。
  - ja: 当動物園は夏休み期間**に限り**、夜9時まで開園しております。
  - ja: 初めてのお客様**に限り**、無料お試しセットをお申し込みいただけます。
  - ja: 工場の見学は予約された方**に限ります**。
