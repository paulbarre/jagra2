id: ni-tsuki
title: 〜につき
meaning:
  en: because of / due to
notes:
  en: This is an expression for stating a reason, mostly for notices or announcements.
structure:
  - "**N**につき"
examples:
  - ja: 清掃中**につき**、お足元にご注意ください。
  - ja: 会場内は禁煙**につき**、おたばこはご遠慮ください。
  - ja: 4月15日（木）：佐康医師、学会出席**につき**休診。
  - ja: ただ今、改装工事中**につき**、左記の仮店舗で営業いたしております。