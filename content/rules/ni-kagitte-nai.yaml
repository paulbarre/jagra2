id: ni-kagitte-nai
title: 〜に限って〜ない
meaning:
  en: there's no way that / would never
notes:
  en: Used to strongly say that someone/something would never do something, because it is completely out of character or impossible.
structure:
  - "**N**に限って〜ない"
examples:
  - ja: うちの子に限って、万引きなんてするはずがありません。
  - ja: 彼に限って浮気なんてするはずがない。
  - ja: 彼に限って、そんな単純なミスをするわけがない。
  - ja: にせものを売るなんて、あの店に限って、そんなことは絶対にない。
