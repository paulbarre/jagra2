id: ni-kagitte-nai
title: 〜に限って〜ない
meaning:
  en: there's no way that / would never
notes:
  en: Used to strongly say that someone/something would never do something, because it is completely out of character or impossible.
structure:
  - "**noun**に限って〜ない"
examples:
  - ja: うちの子**に限って**、万引きなんてするはずが**ありません**。
  - ja: 彼**に限って**浮気なんてするはずが**ない**。
  - ja: 彼**に限って**、そんな単純なミスをするわけが**ない**。
  - ja: にせものを売るなんて、あの店**に限って**、そんなことは絶対に**ない**。
